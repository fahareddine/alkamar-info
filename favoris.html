<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mes Favoris — Alkamar Info</title>
  <meta name="description" content="Vos produits sauvegardés sur Alkamar Info.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    *,::before,::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f8fafc;color:#1e293b}
    .header{background:#0f172a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .header__logo img{height:36px;width:auto}
    .header__actions{display:flex;align-items:center;gap:4px}
    .header__action{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:8px;color:#94a3b8;font-size:11px;text-decoration:none;background:none;border:none;cursor:pointer;position:relative}
    .header__action:hover{background:rgba(255,255,255,.07);color:#f1f5f9}
    .cart-badge,.wish-badge{position:absolute;top:-6px;right:-8px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1}
    .page-title{padding:32px 20px 16px;max-width:1200px;margin:0 auto}
    .page-title h1{font-size:24px;font-weight:800;color:#1e293b}
    .page-title p{color:#64748b;margin-top:4px;font-size:14px}
    .wish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:0 20px 40px;max-width:1200px;margin:0 auto}
    .wish-empty{text-align:center;padding:80px 20px;color:#64748b}
    .wish-empty h2{font-size:20px;margin-bottom:8px;color:#1e293b}
    .wish-empty a{display:inline-block;margin-top:20px;background:#0ea5e9;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:700}
    .wish-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column}
    .wish-card img{width:100%;aspect-ratio:4/3;object-fit:contain;padding:12px;background:#f8fafc}
    .wish-card__body{padding:12px;flex:1;display:flex;flex-direction:column;gap:4px}
    .wish-card__brand{font-size:11px;font-weight:700;color:#0ea5e9;text-transform:uppercase}
    .wish-card__name{font-size:13px;font-weight:600;color:#1e293b;line-height:1.3}
    .wish-card__price{font-size:18px;font-weight:800;color:#1e293b;margin-top:4px}
    .wish-card__kmf{font-size:11px;color:#64748b}
    .wish-card__footer{padding:10px 12px;display:flex;gap:8px;border-top:1px solid #f1f5f9}
    .wish-card__detail{flex:1;background:#0ea5e9;color:#fff;border:none;border-radius:6px;padding:8px;font-size:12px;font-weight:700;text-align:center;text-decoration:none;display:block}
    .wish-card__remove{background:none;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;font-size:12px;color:#94a3b8;cursor:pointer}
    .wish-card__remove:hover{border-color:#ef4444;color:#ef4444}
    .wish-actions{padding:0 20px 16px;max-width:1200px;margin:0 auto;display:flex;justify-content:flex-end}
    .btn-clear{background:none;border:1px solid #e2e8f0;border-radius:6px;padding:8px 16px;font-size:13px;color:#64748b;cursor:pointer}
    .btn-clear:hover{border-color:#ef4444;color:#ef4444}
  </style>
  <link rel="preload" as="style" href="style.css?v=27" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="style.css?v=27"></noscript>
<script>(function(){var l=0;function g(){if(l)return;l=1;var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtag/js?id=G-E8J20K1852';document.head.appendChild(s);window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}window.gtag=gtag;gtag('js',new Date());gtag('config','G-E8J20K1852');}['pointerdown','scroll','keydown','touchstart'].forEach(function(e){document.addEventListener(e,g,{once:true,passive:true});});window.addEventListener('load',function(){setTimeout(g,30000);});})()</script>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────── -->
<header class="header">
  <a href="index.html" class="header__logo" aria-label="Alkamar Info — Accueil">
    <img
      src="/images/alkamar-info-logo.svg"
      alt="Alkamar Info"
      width="120"
      height="36"
      onerror="this.onerror=null;this.src='/images/logo.png'"
    >
  </a>
  <div class="header__actions">
    <!-- Favoris — active sur cette page : cœur rouge plein -->
    <a href="favoris.html" class="header__action" aria-label="Mes favoris" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#ef4444" stroke="#ef4444" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
      </svg>
      <span>Favoris</span>
    </a>
    <!-- Panier -->
    <a href="checkout.html" class="header__action" aria-label="Mon panier">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      <span>Panier</span>
      <span class="cart-badge">0</span>
    </a>
  </div>
</header>

<!-- ── TITRE PAGE ─────────────────────────────────── -->
<div class="page-title">
  <h1>Mes Favoris</h1>
  <p id="wish-subtitle">Chargement…</p>
</div>

<!-- ── BOUTON TOUT SUPPRIMER ──────────────────────── -->
<div class="wish-actions" id="wish-clear-wrap" style="display:none">
  <button class="btn-clear" onclick="clearAll()">Tout supprimer</button>
</div>

<!-- ── GRILLE PRODUITS ────────────────────────────── -->
<div class="wish-grid" id="wish-grid"></div>

<!-- Scripts -->
<script src="/js/wishlist.js?v=1"></script>
<script src="/js/nav.js?v=5" defer></script>
<script src="/js/cart.js?v=3" defer></script>
<script src="/js/cart-ui.js?v=3" defer></script>
<script>
(function () {
  'use strict';

  /* ── Formatage des prix ─────────────────────────────────── */
  function fmtEur(p) {
    return Number(p).toLocaleString('fr-FR', {
      style: 'currency',
      currency: 'EUR',
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    });
  }

  function fmtKmf(kmf, eur) {
    var v = kmf && kmf > 0 ? kmf : Math.round((eur || 0) * 491);
    return v > 0 ? v.toLocaleString('fr-FR') : '—';
  }

  /* ── Construction DOM d'une card (sans innerHTML) ────────── */
  function buildCard(item) {
    var id       = String(item.id || '');
    var name     = String(item.name || 'Produit sans nom');
    var brand    = String(item.brand || '');
    var imgSrc   = String(item.img || '/images/placeholder.png');
    var priceEur = item.price_eur > 0 ? fmtEur(item.price_eur) : '—';
    var priceKmf = fmtKmf(item.price_kmf, item.price_eur);

    var article = document.createElement('article');
    article.className = 'wish-card';

    /* Image */
    var img = document.createElement('img');
    img.src = imgSrc;
    img.alt = name;
    img.width = 200;
    img.height = 150;
    img.loading = 'lazy';
    img.onerror = function () { this.src = '/images/placeholder.png'; };
    article.appendChild(img);

    /* Body */
    var body = document.createElement('div');
    body.className = 'wish-card__body';

    if (brand) {
      var brandEl = document.createElement('p');
      brandEl.className = 'wish-card__brand';
      brandEl.textContent = brand;
      body.appendChild(brandEl);
    }

    var nameEl = document.createElement('p');
    nameEl.className = 'wish-card__name';
    nameEl.textContent = name;
    body.appendChild(nameEl);

    var priceEl = document.createElement('p');
    priceEl.className = 'wish-card__price';
    priceEl.textContent = priceEur;
    body.appendChild(priceEl);

    var kmfEl = document.createElement('p');
    kmfEl.className = 'wish-card__kmf';
    kmfEl.textContent = priceKmf === '—' ? '—' : priceKmf + ' KMF';
    body.appendChild(kmfEl);

    article.appendChild(body);

    /* Footer */
    var footer = document.createElement('div');
    footer.className = 'wish-card__footer';

    var detailLink = document.createElement('a');
    detailLink.href = 'produit.html?id=' + encodeURIComponent(id);
    detailLink.className = 'wish-card__detail';
    detailLink.textContent = 'Voir le détail';
    footer.appendChild(detailLink);

    var removeBtn = document.createElement('button');
    removeBtn.className = 'wish-card__remove';
    removeBtn.setAttribute('aria-label', 'Retirer des favoris');
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', function () { removeItem(id); });
    footer.appendChild(removeBtn);

    article.appendChild(footer);

    return article;
  }

  /* ── Rendu principal ────────────────────────────────────── */
  function render() {
    var list      = window.Wishlist.getList();
    var grid      = document.getElementById('wish-grid');
    var subtitle  = document.getElementById('wish-subtitle');
    var clearWrap = document.getElementById('wish-clear-wrap');

    if (!grid || !subtitle) return;

    /* Vide le contenu actuel */
    while (grid.firstChild) { grid.removeChild(grid.firstChild); }

    if (list.length === 0) {
      clearWrap.style.display = 'none';

      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'wish-empty';

      var emptyTitle = document.createElement('h2');
      emptyTitle.textContent = 'Aucun favori pour le moment';
      emptyDiv.appendChild(emptyTitle);

      var emptyText = document.createElement('p');
      emptyText.textContent = 'Ajoutez des produits à vos favoris pour les retrouver facilement ici.';
      emptyDiv.appendChild(emptyText);

      var emptyLink = document.createElement('a');
      emptyLink.href = 'index.html';
      emptyLink.textContent = 'Découvrir les produits';
      emptyDiv.appendChild(emptyLink);

      grid.appendChild(emptyDiv);
      subtitle.textContent = 'Votre liste de favoris est vide.';
    } else {
      var count = list.length;
      subtitle.textContent = count === 1
        ? '1 produit sauvegardé'
        : count + ' produits sauvegardés';
      clearWrap.style.display = '';
      list.forEach(function (item) {
        grid.appendChild(buildCard(item));
      });
    }
  }

  /* ── Retirer un produit ─────────────────────────────────── */
  function removeItem(id) {
    var list = window.Wishlist.getList();
    var existing = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { existing = list[i]; break; }
    }
    if (existing) {
      window.Wishlist.toggle(id, existing);
    }
  }

  /* ── Tout supprimer ─────────────────────────────────────── */
  window.clearAll = function () {
    if (!confirm('Supprimer tous vos favoris ?')) return;
    window.Wishlist.clear();
  };

  /* ── Sync cross-page ────────────────────────────────────── */
  window.Wishlist.on(render);

  /* ── Premier rendu au chargement ────────────────────────── */
  render();

}());
</script>

</body>
</html>
