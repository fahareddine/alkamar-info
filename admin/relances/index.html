<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relances impayés — Info Experts Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="page-header">
        <h1>💸 Relances impayés</h1>
      </div>
      <p style="font-size:13.5px;color:var(--admin-muted);margin-bottom:20px;line-height:1.6;max-width:680px">
        Commandes Stripe créées mais jamais payées (paniers abandonnés). Le bouton « Relancer » envoie au client
        un email avec un <strong>nouveau lien de paiement</strong> valable immédiatement. Bonne pratique :
        relancer après 2-24h, une seule fois.
      </p>

      <div class="alert" id="rl-status" style="display:none"></div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Commande</th><th>Client</th><th>Montant</th><th>Créée</th><th>Relance</th><th></th></tr></thead>
          <tbody id="rl-body"><tr><td colspan="6" style="text-align:center;color:var(--admin-muted);padding:24px">Chargement…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/admin/js/config.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/layout.js"></script>
  <script src="/admin/js/relances.js"></script>
</body>
</html>
