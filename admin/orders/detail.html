<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commande — Info Experts Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="page-header">
        <h1 id="page-title">Commande</h1>
        <a href="/admin/orders/" class="btn btn--ghost">← Retour</a>
      </div>
      <div id="alert" class="alert" style="display:none"></div>
      <div style="display:grid;grid-template-columns:1fr 320px;gap:20px">
        <div>
          <div class="form-card">
            <h2>Articles commandés</h2>
            <div id="order-items">Chargement...</div>
          </div>
        </div>
        <div>
          <div class="form-card">
            <h2>Statut</h2>
            <div class="form-group">
              <select id="status-select" class="form-control">
                <option value="pending">En attente</option>
                <option value="confirmed">Confirmée</option>
                <option value="shipped">Expédiée</option>
                <option value="delivered">Livrée</option>
                <option value="cancelled">Annulée</option>
              </select>
            </div>
            <div class="form-group">
              <label>Paiement</label>
              <select id="payment-select" class="form-control">
                <option value="unpaid">❌ Non payé</option>
                <option value="awaiting_payment">🕓 En attente (Mobile Money / espèces)</option>
                <option value="paid">✅ Payé</option>
              </select>
              <p style="font-size:12px;color:var(--admin-muted);margin-top:6px">
                Mobile Money reçu ? Passe en « Payé » et note la référence de transaction ci-dessus.
              </p>
            </div>
            <div class="form-group"><label>Note interne</label><textarea id="notes" class="form-control" rows="3" placeholder="Réf. Mobile Money, instructions livraison…"></textarea></div>
            <button id="save-status" class="btn btn--primary" style="width:100%">Mettre à jour</button>
            <p style="font-size:12px;color:var(--admin-muted);margin-top:8px">
              ✉️ Le client reçoit automatiquement un email à chaque changement de statut.
            </p>
          </div>
          <div class="form-card">
            <h2>Client</h2>
            <div id="customer-info">—</div>
            <a id="wa-link" class="btn btn--success" style="width:100%;margin-top:12px;display:none" target="_blank">💬 Contacter sur WhatsApp</a>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/admin/js/config.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/layout.js"></script>
  <script src="/admin/js/order-detail.js"></script>
</body>
</html>
