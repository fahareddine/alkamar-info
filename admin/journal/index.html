<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal d'activité — Info Experts Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="page-header">
        <h1>📜 Journal d'activité</h1>
      </div>
      <p style="font-size:13px;color:var(--admin-muted);margin-bottom:18px">
        Trace de toutes les actions effectuées dans le back-office : qui a modifié quoi, et quand.
      </p>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr></thead>
          <tbody id="jr-body"><tr><td colspan="4" style="text-align:center;color:var(--admin-muted);padding:24px">Chargement…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/admin/js/config.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/layout.js"></script>
  <script src="/admin/js/journal.js"></script>
</body>
</html>
